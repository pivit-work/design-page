name: Deploy to GitHub Pages

# 미리보기 사이트는 «npm 발행이 성공할 때마다» 올린다 — 사이트가 늘 나간 판과 같다.
# 발행은 pivit-work 배포 때 한 번만 하므로(scripts/dp-collect.sh) 하루 몇 번이다.
# 예전처럼 push 마다 돌면 30초 일하고 2분이 깎여(작업마다 분 단위 올림) 한 달에 900분 가까이 썼다.
# 급하면 «Run workflow» 버튼으로 바로 돌린다.
on:
  workflow_run:
    workflows: ['Publish npm package']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 만들기·올리기를 한 작업으로 합쳤다 — 따로 두면 분 단위 올림이 두 번 붙는다.
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 2026-10-06 에 한 번 3시간 반 멈춰 있다가 취소됐다.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
