name: Deploy to GitHub Pages

# 미리보기 사이트는 거의 안 본다. push 마다 돌면 30초 일하고 2분이 깎여(작업마다 분 단위 올림)
# 한 달에 900분 가까이 썼다 — 매일 새벽 한 번만 돌고, 급하면 «Run workflow» 버튼으로 돌린다.
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 한국 새벽 3시
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 만들기·올리기를 한 작업으로 합쳤다 — 따로 두면 분 단위 올림이 두 번 붙는다.
  deploy:
    runs-on: ubuntu-latest
    # 2026-10-06 에 한 번 3시간 반 멈춰 있다가 취소됐다.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 새벽 실행은 마지막 성공 배포 뒤로 main 이 안 바뀌었으면 여기서 끝낸다. 버튼은 늘 배포한다.
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 --json headSha -q '.[0].headSha')
          if [ "$last" = "$GITHUB_SHA" ]; then echo "바뀐 것 없음 — 건너뜀"; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run build
      - if: steps.changed.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.changed.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
