name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/**'
      # 최상위 스타일시트 전체 — 개별 나열은 eval-cycle.css / admin.css / report.css 등이
      # 누락돼 해당 파일 단독 변경 시 배포가 안 되던 문제를 glob 으로 해소
      - 'src/*.css'
      # package.json 의 `exports` 에 실린 최상위 모듈(현재 ./menu -> src/menu.js).
      # 소비자가 import 하는 계약 파일인데 필터에 없어서, menu.js 만 고친 변경이
      # 머지는 되고 publish 는 안 도는 상태였다 — 소비자에겐 영영 반영되지 않는다.
      - 'src/menu.js'
      - 'package.json'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      # 소비자(pivit-work)가 닿을 수 없는 스타일시트를 담은 채 publish 되는 것을 막는다.
      # 버전 bump 전에 세워서, 실패해도 버전 번호를 태우지 않는다. (PW-294)
      - name: Check css exports
        run: npm run check:exports

      - name: Bump patch version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p 'require(\"./package.json\").version')" || true
          git pull --rebase
          git push

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
