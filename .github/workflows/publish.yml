name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/**'
      # 최상위 스타일시트 전체 — 개별 나열은 eval-cycle.css / admin.css / report.css 등이
      # 누락돼 해당 파일 단독 변경 시 배포가 안 되던 문제를 glob 으로 해소
      - 'src/*.css'
      # package.json 의 `exports` 에 실린 최상위 모듈(현재 ./menu -> src/menu.js).
      # 소비자가 import 하는 계약 파일인데 필터에 없어서, menu.js 만 고친 변경이
      # 머지는 되고 publish 는 안 도는 상태였다 — 소비자에겐 영영 반영되지 않는다.
      - 'src/menu.js'
      - 'package.json'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: npm

      # 코드 검사를 돌리려면 eslint 와 그 규칙 묶음이 깔려 있어야 한다.
      - run: npm ci

      # 코드 검사에 오류가 있거나 규칙이 빠진 채 게시되는 것을 막는다. 들여오지 않은 이름으로
      # 화면 조각을 그려 리포트 검수 화면이 안 뜨는 판(0.1.630)이 이 단계 없이 게시됐다. (PW-906)
      - name: Lint
        run: npm run check:lint

      # 소비자(pivit-work)가 닿을 수 없는 스타일시트를 담은 채 publish 되는 것을 막는다.
      # 버전 bump 전에 세워서, 실패해도 버전 번호를 태우지 않는다. (PW-294)
      - name: Check css exports
        run: npm run check:exports

      # 화면이 탭 줄·창을 공용 부품 대신 따로 그린 채 나가는 것을 막는다 — 푸시 전 훅을
      # 건너뛰어도 여기서 걸린다. (PW-836)
      - name: Check shared tabs and modals
        run: npm run check:shared-frames

      # 어드민·평가 화면이 명단 표를 공용 부품(RosterTable) 대신 따로 그린 채 나가는 것을 막는다. (PW-839)
      - name: Check roster tables
        run: npm run check:roster-tables

      # 딱지 생김새가 모으기 전과 달라졌거나, 화면이 딱지를 또 따로 그린 채 나가는 것을 막는다. (PW-840)
      - name: Check status badges
        run: npm run check:status-badges

      # 같은 아이콘 그림을 두 곳에 그린 채 나가는 것을 막는다 — 공용 모음은 shared/lineIcons.jsx. (PW-1011)
      - name: Check icon copies
        run: npm run check:icon-copies

      # CSS 에 글씨체 이름을 직접 적은 채 나가는 것을 막는다. (PW-923)
      - name: Check font families
        run: npm run check:font-families

      # 화면 코드가 붙인 모양 이름이 CSS 어디에도 없는 채 나가는 것을 막는다 — 그 요소는 브라우저
      # 기본 모양으로 그려진다(「신원 정보 저장」 버튼이 회색 기본 버튼으로 나갔다). (PW-991)
      - name: Check undefined class names
        run: npm run check:undefined-classes

      - name: Bump patch version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p 'require(\"./package.json\").version')" || true
          git pull --rebase
          git push

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
