pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,jsx}"
      run: npx eslint {staged_files}

pre-push:
  commands:
    lockfile-sync:
      # CI 의 `npm ci` 가 package.json 과 package-lock.json 불일치로 12회 연속 실패했던 재발 방지.
      # --dry-run 으로 실제 설치 없이 lock 파일 정합성만 검증한다.
      run: npm ci --dry-run --ignore-scripts
    css-exports:
      # 새 src/*.css 를 exports 에 안 실어 소비자가 import 할 경로 자체가 없던 사고
      # 재발 방지 (okr_resource.css / PW-294). design-page 안에서는 상대경로 import 라
      # 멀쩡히 보여서 눈으로는 안 잡힌다.
      run: npm run check:exports
