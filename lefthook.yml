pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,jsx}"
      run: npx eslint {staged_files}

pre-push:
  commands:
    lockfile-sync:
      # CI 의 `npm ci` 가 package.json 과 package-lock.json 불일치로 12회 연속 실패했던 재발 방지.
      # --dry-run 으로 실제 설치 없이 lock 파일 정합성만 검증한다.
      run: npm ci --dry-run --ignore-scripts
    lint:
      # 저장소 전체 코드 검사 + 규칙이 무는지 표본 확인. 커밋 전 검사는 바뀐 파일만 봐서, 두 판이
      # 합쳐지며 생긴 틀린 이름(리포트 검수 화면의 <DpStatusBadge />)을 못 잡았다 (PW-906).
      run: npm run check:lint
    css-exports:
      # 새 src/*.css 를 exports 에 안 실어 소비자가 import 할 경로 자체가 없던 사고
      # 재발 방지 (okr_resource.css / PW-294). design-page 안에서는 상대경로 import 라
      # 멀쩡히 보여서 눈으로는 안 잡힌다.
      run: npm run check:exports
    classnames:
      # 「칸 나누기」 클래스(display:grid)를 버튼·입력칸 «자체» 에 붙이면 그 요소의 모양이
      # 하나도 안 들어온다. PW-602 의 EvalTemplateAddRow 가 그렇게 나갔다 — eslint 는
      # 클래스 이름의 뜻을 모르고, 소비자 유닛 테스트는 jsdom 이라 배치를 안 계산한다.
      run: npm run check:classnames
    shared-frames:
      # 화면이 탭 줄·창을 공용 부품(Tabs·SegmentedControl·ModalShell·ConfirmModal) 대신 따로
      # 그리는 것을 막는다. 주석의 「새로 만들지 말 것」만으로는 안 지켜져 공용 탭을 두 화면,
      # 공용 창 틀을 두 화면만 쓰고 있었다 (PW-836).
      run: npm run check:shared-frames
    roster-tables:
      # 어드민·평가 화면이 명단 표를 공용 부품(RosterTable) 대신 `<table>` 부터 따로 그리는 것을
      # 막는다. 11개 화면에 17벌이 따로 있어 줄 높이·머리 행·구분선이 제각각이었다 (PW-839).
      run: npm run check:roster-tables
    status-badges:
      # 「충족」·「시급」 같은 색 딱지를 화면마다 따로 그려 딱지 규칙이 CSS 20개 파일에 흩어져
      # 있었고, 뜻과 색을 짝지은 표가 없어 같은 뜻이 화면마다 다른 색이었다 (PW-840).
      # ① 모으기 전후 생김새가 같은가 ② 뜻→색 표가 한 곳인가 ③ 또 따로 그리지 않았나.
      run: npm run check:status-badges
    icon-copies:
      # 같은 아이콘 그림을 두 곳에 그리는 것을 막는다. 닫기(X) 하나가 22곳에 복사돼 있었고 자물쇠는
      # 뜻이 같은데 모양이 다섯 가지였다 — 두 곳 이상 쓰는 그림은 shared/lineIcons.jsx 한 벌이다 (PW-1011).
      run: npm run check:icon-copies
    font-families:
      # CSS 에 글씨체 이름을 직접 적는 것을 막는다. 어드민 화면을 옮기며 따라 들어온 'DM Mono' 가
      # 불러오는 곳이 없어 타자기체로 그려졌고 아무 검사도 못 봤다 (PW-923).
      run: npm run check:font-families
    undefined-classes:
      # 화면 코드가 붙인 모양 이름(클래스)이 CSS 어디에도 없으면 그 요소는 브라우저 기본 모양으로
      # 그려진다. 「신원 정보 저장」 버튼이 정의된 적 없는 admin-btn-primary 를 달고 회색 기본
      # 버튼으로 나갔고, 그날 재 보니 그런 이름이 63개였다. 눈으로만 보이던 것이다 (PW-991).
      run: npm run check:undefined-classes
    side-stripes:
      # 카드·안내 상자에 한쪽만 굵은 색 선을 긋는 것을 막는다. 앱 전체 20곳 중 디자이너가 그린 것은
      # 「상자 없이 글자 옆 선만」 두 곳뿐이었고 나머지 18곳은 따로 붙어 색·두께가 제각각이었다 (PW-1101).
      run: npm run check:side-stripes
