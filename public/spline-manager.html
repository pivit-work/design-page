<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: pointer; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>
  <script>
    /* iframe 위에서 wheel 시 spline scene 이 이벤트를 잡아 부모 페이지 스크롤이 막힘.
       wheel 을 capture 단계에서 가로채서 부모로 전달, 부모가 자기 컨테이너를 스크롤. */
    window.addEventListener('wheel', (e) => {
      window.parent.postMessage({
        type: 'spline-wheel',
        deltaX: e.deltaX,
        deltaY: e.deltaY,
      }, '*');
    }, { capture: true, passive: true });
  </script>
  <script type="module">
    /* 시간 함수 monkey-patch: 부모창의 'pause-spline' 메시지를 받으면 가짜 시간을
       freeze 해서 spline scene 의 모든 애니메이션이 그 자리에 멈추게 한다.
       'resume-spline' 으로 다시 진행. RAF 자체는 계속 호출되지만 timestamp 가
       동결이라 spline runtime 이 새 frame 을 그릴 일이 없어 GPU 부하가 줄어든다. */
    const origPerfNow = performance.now.bind(performance);
    const origDateNow = Date.now.bind(Date);
    let pauseStart = 0;
    let pauseAccum = 0;
    let isPaused = false;

    performance.now = function () {
      if (isPaused) return pauseStart - pauseAccum;
      return origPerfNow() - pauseAccum;
    };
    Date.now = function () {
      if (isPaused) return origDateNow() - (origPerfNow() - pauseStart) - pauseAccum;
      return origDateNow() - pauseAccum;
    };
    const origRAF = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = function (cb) {
      return origRAF(() => cb(performance.now()));
    };

    /* 새 scene(L6vcVdzQjJgBWFGD) 은 1.12.74 보다 최신 .splinecode 라
       runtime 을 1.12.92 로 사용한다. */
    const { Application } = await import('https://unpkg.com/@splinetool/runtime@1.12.92/build/runtime.js');

    const params = new URLSearchParams(window.location.search);
    const sceneUrl = params.get('scene') || 'https://prod.spline.design/L6vcVdzQjJgBWFGD/scene.splinecode';
    const imageUrl = params.get('img');

    const canvas = document.getElementById('canvas3d');
    const app = new Application(canvas);

    /* 인트로 재생 trigger 는 부모창의 'play-intro' / 'snap-to-end' 메시지로 받는다.
       자동 'start' 는 reset 으로 막아두고, 부모가 viewport 진입 순서대로 발사. */
    let isReady = false;
    const pendingMessages = [];

    app.load(sceneUrl).then(() => {
      resetIntro(app);

      if (imageUrl) {
        applyTexture(app, 'profileImage', imageUrl, () => {
          applyTexture(app, 'profileImage-2', imageUrl, () => {
            finalize();
          });
        });
      } else {
        finalize();
      }
    });

    function finalize() {
      resetIntro(app);
      isReady = true;
      window.parent.postMessage({ type: 'spline-ready' }, '*');
      while (pendingMessages.length) handleMessage(pendingMessages.shift());
    }

    function resetIntro(splineApp) {
      try { splineApp.emitEventReverse('start', 'Group'); } catch (e) { /* no-op */ }
    }

    function playIntro(splineApp) {
      try { splineApp.emitEvent('start', 'Group'); } catch (e) { /* no-op */ }
    }

    window.addEventListener('message', (e) => {
      if (!e.data?.type) return;
      if (e.data.type === 'pause-spline') {
        if (!isPaused) {
          isPaused = true;
          pauseStart = origPerfNow();
        }
        return;
      }
      if (e.data.type === 'resume-spline') {
        if (isPaused) {
          pauseAccum += origPerfNow() - pauseStart;
          isPaused = false;
        }
        return;
      }
      if (!isReady) {
        pendingMessages.push(e.data);
        return;
      }
      handleMessage(e.data);
    });

    function handleMessage(data) {
      if (data.type === 'play-intro') {
        playIntro(app);
      } else if (data.type === 'snap-to-end') {
        playIntro(app);
      }
    }

    /* 조직도 ProfileModal/spline-profile.html 과 동일한 텍스처 교체 패턴 */
    function applyTexture(splineApp, objectName, imageSrc, onDone) {
      const obj = splineApp.findObjectByName(objectName);
      if (!obj) {
        if (onDone) onDone();
        return;
      }
      const texLayer = [...Array(obj.material.layers.length)]
        .map((_, i) => obj.material.layers[i])
        .find((l) => l.type === 'texture');
      if (!texLayer) {
        if (onDone) onDone();
        return;
      }

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = imageSrc;
      img.onload = () => {
        texLayer.updateTexture(img);
        const c = document.createElement('canvas');
        c.width = img.width;
        c.height = img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        texLayer.updateTexture(c.toDataURL('image/png'));
        const tex = texLayer.texture;
        tex.image = img;
        texLayer.texture = tex;
        if (onDone) onDone();
      };
    }
  </script>
</body>
</html>
