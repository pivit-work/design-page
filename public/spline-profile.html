<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: transparent; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>
  <script type="module">
    /* 회전 속도 조절: ?speed=0.25 같이 query 로 받으면 RAF 자체를 setTimeout 으로
       throttle 해서 frame rate 를 줄인다 (60fps → 15fps).
       spline runtime 이 어떤 시간 API 로 진행 계산하든 frame 자체가 적게 그려지므로
       회전이 그 비율로 느려진다.
       부수 효과로 가짜 timestamp 도 함께 진행해서 internal 시간 계산도 보정한다. */
    const params = new URLSearchParams(window.location.search);
    const speed = parseFloat(params.get('speed') || '1');
    if (Number.isFinite(speed) && speed > 0 && speed !== 1) {
      const frameInterval = (1000 / 60) / speed; // speed 0.25 → 약 67ms (≈15fps)

      const origPerfNow = performance.now.bind(performance);
      const origDateNow = Date.now.bind(Date);
      const perfStart = origPerfNow();
      const dateStart = origDateNow();
      performance.now = function () {
        return perfStart + (origPerfNow() - perfStart) * speed;
      };
      Date.now = function () {
        return dateStart + (origDateNow() - dateStart) * speed;
      };

      window.requestAnimationFrame = function (cb) {
        return setTimeout(() => cb(performance.now()), frameInterval);
      };
    }

    const { Application } = await import('https://unpkg.com/@splinetool/runtime@1.12.74/build/runtime.js');
    const imageUrl = params.get('img');

    const canvas = document.getElementById('canvas3d');
    const app = new Application(canvas);

    let splineApp = null;

    app.load('https://prod.spline.design/lUTrZH2tVSyiKzPA/scene.splinecode').then(() => {
      splineApp = app;
      if (imageUrl) {
        applyTexture(app, 'profileImage', imageUrl, () => {
          applyTexture(app, 'profileImage-2', imageUrl, () => {
            window.parent.postMessage({ type: 'spline-ready' }, '*');
          });
        });
      } else {
        window.parent.postMessage({ type: 'spline-ready' }, '*');
      }
    });

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'setImage' && splineApp) {
        applyTexture(splineApp, 'profileImage', e.data.url);
        applyTexture(splineApp, 'profileImage-2', e.data.url);
      }
    });

    function applyTexture(splineApp, objectName, imageSrc, onDone) {
      const obj = splineApp.findObjectByName(objectName);
      if (!obj) return;
      const texLayer = [...Array(obj.material.layers.length)]
        .map((_, i) => obj.material.layers[i])
        .find((l) => l.type === 'texture');
      if (!texLayer) return;

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = imageSrc;
      img.onload = () => {
        texLayer.updateTexture(img);
        const c = document.createElement('canvas');
        c.width = img.width;
        c.height = img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        texLayer.updateTexture(c.toDataURL('image/png'));
        const tex = texLayer.texture;
        tex.image = img;
        texLayer.texture = tex;
        if (onDone) onDone();
      };
    }
  </script>
</body>
</html>
